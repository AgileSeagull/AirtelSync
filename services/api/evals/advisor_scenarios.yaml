# Advisor evaluation scenarios. Each scenario is a conversation plus assertions on the
# bundle the advisor ends up recommending (checked against engine output, not text).
#   expect.segment                  inferred segment
#   expect.tier                     which tier to check (default: recommended)
#   expect.include / exclude        product ids in / not in that tier
#   expect.first                    the primary connectivity product
#   expect.qty                      {product_id: quantity}
#   expect.excluded                 products reported as not available (with a rule)
#   expect.note                     substring expected in the engine notes
#   expect.handoff                  conversation should end in a human handoff
#   expect.no_gst_products          no product that needs GST registration in any tier
- id: dental-clinic-kochi
  lang: en
  messages: ["Hi, I run a dental clinic in Kochi", "12 staff, one clinic", "We need CCTV and business email. Home broadband now, about Rs 3000 a month", "32TTNXB7384T1ZW"]
  expect: {segment: prof, first: P02, include: [P16, P23], qty: {P16: 7}}

- id: kirana-no-gst-hindi
  lang: hi
  messages: ["मेरी किराना दुकान है पटना में", "2 लोग", "बिलिंग और व्हाट्सएप चाहिए, अभी हॉटस्पॉट है, ₹800 महीना", "नहीं"]
  expect: {segment: micro, first: P01, include: [P19, P07], excluded: [P15], no_gst_products: true, note: "Register for GST"}

